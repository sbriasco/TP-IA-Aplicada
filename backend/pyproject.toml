[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsight"
version = "0.1.0"
description = "Backend y worker local de FlowSight"
requires-python = "==3.11.*"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "numpy==2.4.6",
    "openai==1.109.1",
    "opencv-python-headless==4.10.0.84",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "torch==2.7.1+cpu",
    "torchvision==0.22.1+cpu",
    "ultralytics==8.4.153",
    "uvicorn==0.53.0",
    "websockets==17.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp -m \"not gpu and not historical_migration\""
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gpu: ejecución real en el equipo de referencia; queda fuera de la suite y de CI",
    "historical_migration: migraciones 0002 a 0005, ya aplicadas; pytest -m historical_migration",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
