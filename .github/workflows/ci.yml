name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flowsight
          POSTGRES_USER: flowsight
          POSTGRES_PASSWORD: flowsight-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowsight -d flowsight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLOWSIGHT_ENV: test
      FLOWSIGHT_DATABASE_URL: postgresql+psycopg://flowsight:flowsight-ci@127.0.0.1:5432/flowsight
      FLOWSIGHT_API_HOST: 127.0.0.1
      FLOWSIGHT_API_PORT: 8000
      FLOWSIGHT_WORKER_ID: worker-ci
      FLOWSIGHT_PREVIEW_MAX_FPS: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Instalar backend
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Verificar backend
        working-directory: backend
        run: |
          ruff check .
          pytest

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Verificar frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flowsight
          POSTGRES_USER: flowsight
          POSTGRES_PASSWORD: flowsight-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowsight -d flowsight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLOWSIGHT_ENV: test
      FLOWSIGHT_DATABASE_URL: postgresql+psycopg://flowsight:flowsight-ci@127.0.0.1:5432/flowsight
      FLOWSIGHT_API_HOST: 127.0.0.1
      FLOWSIGHT_API_PORT: 8000
      FLOWSIGHT_WORKER_ID: worker-e2e
      FLOWSIGHT_PREVIEW_MAX_FPS: 5
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_WS_BASE_URL: ws://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock
          backend/.venv/bin/pip install --no-deps -e backend
      - name: Preparar frontend y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verificar recorrido E2E
        working-directory: frontend
        run: npm run test:e2e
